[package]
name = "rc2s2-hub"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rc2s2-proto = { version = "0.1.0", path = "../proto" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "fs"] }
tokio-stream = "0.1.19"
tonic = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
rc2s2-node = { path = "../node" }
tempfile = "3.27.0"
