[package]
name = "rc2s2-proto"
version.workspace = true
edition.workspace = true

[dependencies]
prost = "0.14.4"
tonic = "0.14.6"
tonic-prost = "0.14.6"

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "sync"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
